<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Gallery – SOHIL Hair Studio</title>
    <meta name="description" content="Explore the full premium haircut and grooming gallery of Sohil Hair Studio.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #e01010;
            --red-glow: rgba(220, 20, 20, 0.55);
            --bg: #080808;
            --card-bg: #100000;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'Manrope', Arial, sans-serif;
            background: radial-gradient(ellipse at top, #2a0000 0%, #0d0000 40%, #030303 85%);
            color: #fff;
            overflow-x: hidden;
            /* Page enter animation */
            animation: pageEnter 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(22px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* ─── Ambient glow ─── */
        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #cc0000 0%, transparent 70%);
            filter: blur(140px);
            opacity: 0.1;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── Page transition overlay ─── */
        #page-transition-out {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        #page-transition-out.active {
            opacity: 1;
            pointer-events: all;
        }

        /* ─── HEADER ─── */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 48px 20px 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .back-btn:hover {
            color: var(--red);
            transform: translateX(-4px);
        }
        .back-btn i { font-size: 12px; }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: clamp(30px, 6vw, 60px);
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            line-height: 1.1;
            display: block;
        }

        .logo span {
            color: var(--red);
        }

        header p {
            margin-top: 10px;
            color: #888;
            letter-spacing: 3px;
            font-size: clamp(10px, 1.5vw, 13px);
            text-transform: uppercase;
        }

        .header-line {
            width: 60px;
            height: 3px;
            background: var(--red);
            margin: 18px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 12px var(--red-glow);
        }

        /* ─── GALLERY GRID ─── */
        .gallery {
            position: relative;
            z-index: 1;
            width: min(1500px, 96%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            padding: 24px 0 60px;
        }

        /* ─── CARD ─── */
        .card {
            position: relative;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 0, 0.45);
            box-shadow:
                0 0 6px rgba(255, 0, 0, 0.18),
                inset 0 0 12px rgba(255, 0, 0, 0.06);
            cursor: pointer;

            /* stagger animation set by JS */
            opacity: 0;
            transform: translateY(28px) scale(0.96);
            transition:
                opacity 0.55s cubic-bezier(0.22,1,0.36,1),
                transform 0.55s cubic-bezier(0.22,1,0.36,1),
                box-shadow 0.35s ease,
                border-color 0.35s ease;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Shine sweep on hover */
        .card::before {
            content: "";
            position: absolute;
            width: 65%;
            height: 180%;
            top: -40%;
            left: -110%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
            transform: rotate(25deg);
            transition: 0.65s ease;
            z-index: 2;
            pointer-events: none;
        }
        .card:hover::before { left: 150%; }

        .card:hover {
            transform: translateY(-8px) scale(1.035);
            border-color: #ff2828;
            box-shadow:
                0 0 10px #ff0000,
                0 0 26px rgba(255, 0, 0, 0.65),
                0 12px 30px rgba(0,0,0,0.5);
        }

        /* ─── IMAGE ─── */
        .card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.6s ease;
            will-change: transform;
        }
        .card:hover img {
            transform: scale(1.09);
            filter: brightness(1.1) contrast(1.08) saturate(1.12);
        }

        /* ─── Dark gradient overlay ─── */
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.82), transparent 55%);
            pointer-events: none;
            z-index: 1;
        }

        /* ─── Card title ─── */
        .card-title {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 3;
            font-size: clamp(10px, 1.4vw, 13px);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 6px #ff0000, 0 0 12px rgba(255,0,0,0.6);
            letter-spacing: 0.5px;
        }

        /* ─── LIGHTBOX ─── */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            animation: lbIn 0.3s ease;
        }
        #lightbox.open { display: flex; }

        @keyframes lbIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #lightbox img {
            max-width: 92vw;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255,0,0,0.4), 0 0 80px rgba(0,0,0,0.7);
            animation: lbImgIn 0.35s cubic-bezier(0.22,1,0.36,1);
        }

        @keyframes lbImgIn {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        #lightbox-close {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,0,0,0.5);
            background: rgba(20,0,0,0.7);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s, border-color 0.25s, transform 0.25s;
        }
        #lightbox-close:hover {
            background: var(--red);
            border-color: var(--red);
            transform: rotate(90deg) scale(1.1);
        }

        /* ─── FOOTER ─── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 24px 20px 40px;
            border-top: 1px solid rgba(255,0,0,0.15);
            color: #555;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            header { padding-top: 32px; }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .card { border-radius: 10px; }
            .card-title { font-size: 10px; bottom: 7px; left: 7px; }
        }

        @media (max-width: 350px) {
            .gallery { gap: 7px; }
        }

        /* ─── Reduced motion ─── */
        @media (prefers-reduced-motion: reduce) {
            body, .card, #lightbox img { animation: none !important; transition: none !important; }
            .card { opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>

<body>

    <!-- Page transition overlay -->
    <div id="page-transition-out"></div>

    <!-- HEADER -->
    <header>
        <div style="display:flex;justify-content:space-between;align-items:center;max-width:1500px;margin:0 auto 20px;">
            <a href="index.html#gallery" class="back-btn" id="backBtn" style="margin-bottom:0;">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
            <a href="admin/index.html" class="admin-nav-icon" title="Admin Login" aria-label="Admin Login" style="width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,26,26,0.45);background:rgba(255,255,255,0.06);color:#ff3333;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 0 12px rgba(255,0,0,0.25);">
                <i class="fa-solid fa-user-shield"></i>
            </a>
        </div>
        <div class="logo">SOHIL <span>COLLECTIONS</span></div>
        <p>Premium Haircut Gallery</p>
        <div class="header-line"></div>
    </header>

    <!-- GALLERY -->
    <main class="gallery" id="gallery">

        <!-- Sample Cut -->
        <div class="card"><img src="h/WhatsApp Image 2026-10-21 at 2.02.43 PM.webp" alt="Modern Fade" loading="lazy" width="400" height="410"><div class="card-title">Modern Fade</div></div>

    </main>

    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image Preview">
        <button id="lightbox-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <img id="lightbox-img" src="" alt="Expanded view">
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 SOHIL Hair Studio &nbsp;|&nbsp; All Rights Reserved</p>
    </footer>

    <script>
        // ─── Staggered card reveal on load ───
        const cards = document.querySelectorAll('.card');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const idx  = parseInt(card.dataset.idx, 10);
                    setTimeout(() => card.classList.add('visible'), idx * 55);
                    observer.unobserve(card);
                }
            });
        }, { threshold: 0.08 });

        cards.forEach((card, i) => {
            card.dataset.idx = i;
            observer.observe(card);
        });

        // ─── Lightbox ───
        const lb    = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const src = card.querySelector('img').src;
                const alt = card.querySelector('img').alt;
                lbImg.src = src;
                lbImg.alt = alt;
                lb.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        });

        document.getElementById('lightbox-close').addEventListener('click', closeLb);
        lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });

        function closeLb() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            lbImg.src = '';
        }

        // ─── Cinematic page-exit transition for back button ───
        const overlay = document.getElementById('page-transition-out');

        function navigateBack() {
            if (overlay) overlay.classList.add('active');
            setTimeout(() => {
                window.location.href = 'index.html#gallery';
            }, 350);
        }

        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                navigateBack();
            });
        }

        // ─── Image fade-in on load (Part 2 performance) ───
        document.querySelectorAll('.card img').forEach(img => {
            img.style.opacity = '0';
            img.style.transition = 'opacity 0.5s ease';
            if (img.complete && img.naturalWidth > 0) {
                img.style.opacity = '1';
            } else {
                img.addEventListener('load', function() { this.style.opacity = '1'; });
            }
        });
    </script>

    <!-- ===================== GALLERY SYNC — FULL GALLERY + LOAD MORE ===================== -->
    <!-- Priority 1: Firebase (when configured). Priority 2: Admin localStorage. Priority 3: Static HTML. -->
    <script type="module">
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const lb    = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');

        function closeLb() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            lbImg.src = '';
        }

        function attachLightbox(card) {
            card.addEventListener('click', () => {
                lbImg.src = card.dataset.fullUrl || card.querySelector('img').src;
                lbImg.alt = card.querySelector('img').alt || '';
                lb.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        }

        function createCard(p, idx) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.idx = idx;
            card.dataset.fullUrl = p.url;
            card.innerHTML = `
                <img src="${p.thumbUrl || p.url}" alt="${p.title || 'Gallery Photo'}" loading="lazy" style="opacity:0;transition:opacity 0.5s ease">
                <div class="card-title">${p.title || 'Premium Style'}</div>`;
            const img = card.querySelector('img');
            img.onload = function() { this.style.opacity = '1'; card.classList.add('visible'); };
            img.onerror = function() { this.style.opacity = '1'; };
            return card;
        }

        const cardObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const c = entry.target;
                    setTimeout(() => c.classList.add('visible'), (parseInt(c.dataset.idx)||0) * 40);
                    cardObserver.unobserve(c);
                }
            });
        }, { threshold: 0.08 });

        // ── PRIORITY 1: Firebase (when configured) ──
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY') {
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
            const { getFirestore, collection, query, orderBy, getDocs, limit, startAfter } =
                await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');

            const app = initializeApp(firebaseConfig, 'gallery-view-more');
            const db  = getFirestore(app);
            const PAGE_SIZE = 20;
            let lastDoc = null;
            let isFirst = true;

            const galleryEl = document.getElementById('gallery');

            async function loadMore() {
                try {
                    const constraints = [orderBy('order','asc'), orderBy('createdAt','desc'), limit(PAGE_SIZE)];
                    if (lastDoc) constraints.push(startAfter(lastDoc));
                    const snap = await getDocs(query(collection(db,'gallery'), ...constraints));

                    if (isFirst && !snap.empty) {
                        galleryEl.innerHTML = '';
                        isFirst = false;
                    }

                    let globalIdx = galleryEl.querySelectorAll('.card').length;
                    snap.forEach(d => {
                        const card = createCard(d.data(), globalIdx++);
                        galleryEl.appendChild(card);
                        cardObserver.observe(card);
                        attachLightbox(card);
                    });

                    lastDoc = snap.docs[snap.docs.length - 1] || null;

                    const lmWrap = document.getElementById('loadMoreWrap');
                    if (lmWrap) lmWrap.style.display = snap.docs.length >= PAGE_SIZE ? 'block' : 'none';

                } catch(e) {
                    console.warn('view-more Firebase sync error:', e.message);
                }
            }

            if (!document.getElementById('loadMoreWrap')) {
                const wrap = document.createElement('div');
                wrap.id = 'loadMoreWrap';
                wrap.style.cssText = 'text-align:center;padding:30px 20px;';
                wrap.innerHTML = `<button id="loadMoreBtn" style="
                    padding:12px 32px;border-radius:10px;border:1px solid rgba(220,20,20,0.5);
                    background:rgba(220,20,20,0.1);color:#ff9999;font-family:sans-serif;
                    font-size:14px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;">
                    <i class="fa-solid fa-plus" style="margin-right:8px"></i>Load More Photos
                </button>`;
                galleryEl.after(wrap);
                document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
            }

            loadMore();

        // ── PRIORITY 2: Admin localStorage (no Firebase yet) ──
        } else {
            try {
                const stored = localStorage.getItem('sohil_gallery');
                if (stored) {
                    const allPhotos = JSON.parse(stored);
                    if (allPhotos && allPhotos.length > 0) {
                        // Sort by display order
                        const sorted = allPhotos.sort((a, b) => (a.order || 99) - (b.order || 99));

                        const galleryEl = document.getElementById('gallery');
                        const PAGE_SIZE = 20;
                        let page = 0;

                        function renderPage() {
                            const batch = sorted.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
                            if (page === 0 && batch.length > 0) galleryEl.innerHTML = '';

                            let startIdx = galleryEl.querySelectorAll('.card').length;
                            batch.forEach((p, i) => {
                                const card = createCard(p, startIdx + i);
                                galleryEl.appendChild(card);
                                cardObserver.observe(card);
                                attachLightbox(card);
                            });

                            page++;
                            const lmWrap = document.getElementById('loadMoreWrap');
                            if (lmWrap) {
                                lmWrap.style.display = (page * PAGE_SIZE < sorted.length) ? 'block' : 'none';
                            }
                        }

                        // Add Load More button
                        if (!document.getElementById('loadMoreWrap')) {
                            const wrap = document.createElement('div');
                            wrap.id = 'loadMoreWrap';
                            wrap.style.cssText = 'text-align:center;padding:30px 20px;display:none;';
                            wrap.innerHTML = `<button id="loadMoreBtn" style="
                                padding:12px 32px;border-radius:10px;border:1px solid rgba(220,20,20,0.5);
                                background:rgba(220,20,20,0.1);color:#ff9999;font-family:sans-serif;
                                font-size:14px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;">
                                <i class="fa-solid fa-plus" style="margin-right:8px"></i>Load More Photos
                            </button>`;
                            galleryEl.after(wrap);
                            document.getElementById('loadMoreBtn').addEventListener('click', renderPage);
                        }

                        renderPage();
                    }
                }
                // If nothing in localStorage → static HTML cards remain (Priority 3)
            } catch(e) { console.warn('localStorage gallery error (view-more):', e.message); }
        }
    </script>

</body>
</html>
